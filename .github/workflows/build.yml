name: Building

on: [push, pull_request]

jobs:
  macos-build-x86_64:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
          python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64-apple-darwin
          command: build
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-macos-x86_64-${{ matrix.python-version }}
          path: ./dist/*.whl

  macos-build-aarch64:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64-apple-darwin
          command: build
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-macos-aarch64-${{ matrix.python-version }}
          path: ./dist/*.whl


  windows-build:
    name: windows-build-${{ matrix.arch }} (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        arch: ['x86', 'x64']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}

      - name: Build wheels
        if: matrix.arch == 'x86'
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist --target i686-pc-windows-msvc

      - name: Build wheels
        if: matrix.arch == 'x64'
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist

      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-win-${{ matrix.arch }}-${{ matrix.python-version }}
          path: ./dist/*.whl


  linux-build:
    name: 'linux-build-${{ matrix.target }} (${{ matrix.python.version }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        python: [
          {
            version: '3.9',
            PYO3_CROSS_LIB_DIR: '/opt/python/cp39-cp39/lib'
          },
          {
            version: '3.10',
            PYO3_CROSS_LIB_DIR: '/opt/python/cp310-cp310/lib'
          },
          {
            version: '3.11',
            PYO3_CROSS_LIB_DIR: '/opt/python/cp311-cp311/lib'
          },
          {
            version: '3.12',
            PYO3_CROSS_LIB_DIR: '/opt/python/cp312-cp312/lib'
          },
          {
            version: '3.13',
            PYO3_CROSS_LIB_DIR: '/opt/python/cp313-cp313/lib'
          },
          {
            version: '3.14',
            PYO3_CROSS_LIB_DIR: '/opt/python/cp314-cp314/lib'
          }
        ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python.version }}

      - name: Build wheels
        if: matrix.target == 'x86_64'
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          command: build
          manylinux: 2014
          args: --release --out dist --interpreter python${{ matrix.python.version }}

      - name: Build wheels
        if: matrix.target == 'aarch64'
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          PYO3_CROSS_LIB_DIR: '${{ matrix.python.PYO3_CROSS_LIB_DIR }}'
        with:
          # maturin >=1.12 parses the target's PEP 739 build-details.json, but the
          # cp314 file in the manylinux images lacks the required abi.extension_suffix
          # field. Pin below 1.12 so cross-compiling uses _sysconfigdata instead.
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          command: build
          manylinux: auto
          args: --release --out dist --interpreter python${{ matrix.python.version }}


      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-linux-${{ matrix.target }}-${{ matrix.python.version }}
          path: ./dist/*.whl

  # sdist is needed for the conda recipe
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Build sdist
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: ./dist/*.tar.gz

  merge-artifacts:
    runs-on: ubuntu-latest
    needs: [linux-build, windows-build, macos-build-aarch64, macos-build-x86_64]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: all-wheels
          pattern: binary-*
          delete-merged: true
