name: Building

on: [push, pull_request]

jobs:
  macos-build-x86_64:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
          python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14', '3.14t', '3.15', '3.15t' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64-apple-darwin
          command: build
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-macos-x86_64-${{ matrix.python-version }}
          path: ./dist/*.whl

  macos-build-aarch64:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14', '3.14t', '3.15', '3.15t' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64-apple-darwin
          command: build
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-macos-aarch64-${{ matrix.python-version }}
          path: ./dist/*.whl


  windows-build:
    name: windows-build-${{ matrix.arch }} (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14', '3.14t', '3.15', '3.15t' ]
        arch: ['x86', 'x64']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}

      - name: Build wheels
        if: matrix.arch == 'x86'
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist --target i686-pc-windows-msvc

      - name: Build wheels
        if: matrix.arch == 'x64'
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist

      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-win-${{ matrix.arch }}-${{ matrix.python-version }}
          path: ./dist/*.whl


  linux-build:
    name: 'linux-build-${{ matrix.platform.target }} (${{ matrix.python-version }})'
    # Each target is built natively, in the manylinux2014 image of its architecture
    # (the aarch64 cross-compiling image lags behind on Python versions)
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { target: x86_64, runner: ubuntu-latest }
          - { target: aarch64, runner: ubuntu-24.04-arm }
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14', '3.14t', '3.15', '3.15t' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          command: build
          manylinux: 2014
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-linux-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: ./dist/*.whl

  # sdist is needed for the conda recipe
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Build sdist
        uses: messense/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      # Upload the wheels of the build for manual download/inspection
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: ./dist/*.tar.gz

  merge-artifacts:
    runs-on: ubuntu-latest
    needs: [linux-build, windows-build, macos-build-aarch64, macos-build-x86_64]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: all-wheels
          pattern: binary-*
          delete-merged: true
